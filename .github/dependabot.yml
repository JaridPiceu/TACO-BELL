# Dependabot config lives here (.github/dependabot.yml), not in
# .github/workflows/ — anything in that folder is run as a workflow.
version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows/ (keeps the pins and
  # updates the "# vX.Y.Z" comments).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Julia package compat bounds in Project.toml.
  - package-ecosystem: "julia"
    directories: ["/", "/test"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
